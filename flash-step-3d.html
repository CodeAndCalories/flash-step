<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
@import url('https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;touch-action:none;font-family:'Share Tech Mono',monospace;user-select:none}
canvas{display:block;position:fixed;top:0;left:0}

#ui{position:fixed;top:0;left:0;right:0;padding:12px 18px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:10}
.stat{color:#991111;font-size:11px;letter-spacing:2px;text-shadow:0 0 8px #ff000066;line-height:1.9}

#overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;z-index:30}
#overlay.hidden{display:none}
.title{font-family:'Creepster',cursive;font-size:clamp(50px,12vw,88px);color:#fff;letter-spacing:6px;text-shadow:0 0 40px #fff5,0 0 100px #fff2;margin-bottom:4px;text-align:center}
.subtitle{color:#991111;font-size:clamp(10px,2.5vw,12px);letter-spacing:4px;text-transform:uppercase;margin-bottom:44px;text-align:center;line-height:2.2;padding:0 30px;text-shadow:0 0 10px #ff0000}
.btn{background:transparent;border:1px solid #771111;color:#bb2222;font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:5px;padding:13px 40px;cursor:pointer;text-transform:uppercase;box-shadow:0 0 20px #77111122,inset 0 0 20px #77111111;transition:all .2s;-webkit-tap-highlight-color:transparent;margin-top:6px}
.btn:hover,.btn:active{background:#77111122;box-shadow:0 0 40px #77111144}
.hint{margin-top:26px;color:#333;font-size:10px;letter-spacing:3px;text-align:center;line-height:2.3}

#msgscreen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000000f0;z-index:30;opacity:0;pointer-events:none;transition:opacity .5s}
#msgscreen.show{opacity:1;pointer-events:all}
.msg-title{font-family:'Creepster',cursive;font-size:clamp(54px,14vw,104px);letter-spacing:4px}
.dead .msg-title{color:#ff1111;text-shadow:0 0 60px #ff0000,0 0 120px #ff000055}
.win  .msg-title{color:#eee;text-shadow:0 0 50px #ffffff77}
.msg-sub{margin-top:8px;font-size:11px;letter-spacing:4px;color:#555}
.msg-info{margin-top:4px;font-size:9px;letter-spacing:3px;color:#333}

#flash-btn{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:96px;height:86px;background:transparent;border:1px solid #ffffff14;color:#ffffff20;font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:3px;border-radius:10px;cursor:pointer;pointer-events:all;z-index:11;-webkit-tap-highlight-color:transparent;transition:all .08s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
#flash-btn .fi{font-size:24px;line-height:1;opacity:0.3}
#flash-btn.active{border-color:#ffffffcc;box-shadow:0 0 60px #ffffff22;background:#ffffff0c}
#flash-btn.active .fi{opacity:1}
#dpad{position:fixed;bottom:16px;left:12px;display:flex;flex-direction:column;gap:5px;z-index:11;pointer-events:all}
.db{width:68px;height:68px;background:#ffffff06;border:1px solid #ffffff0e;color:#ffffff30;font-size:22px;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:background .08s}
.db:active,.db.pressed{background:#ffffff18;color:#ffffff66}
#turn-btns{position:fixed;bottom:16px;right:12px;display:flex;flex-direction:row;gap:5px;z-index:11;pointer-events:all}
.tb{width:66px;height:140px;background:#ffffff06;border:1px solid #ffffff0e;color:#ffffff30;font-size:26px;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:background .08s}
.tb:active,.tb.pressed{background:#ffffff18;color:#ffffff66}
#crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:8;opacity:0.15}
#s-moving{color:#881111;font-size:8px;letter-spacing:3px;margin-top:2px;opacity:0;transition:opacity .1s;text-shadow:0 0 6px #ff0000}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <div class="stat" id="s-flash">FLASHES<br>0</div>
  <div style="text-align:center;pointer-events:none">
    <div class="stat" id="s-level">LEVEL 1</div>
    <div id="s-moving">● MOVING</div>
  </div>
  <div class="stat" style="text-align:right" id="s-dist">DIST<br>—</div>
</div>

<div id="overlay">
  <div class="title">THE<br>FLASH-STEP</div>
  <div class="subtitle">Every time you look —<br>it takes a step closer.<br>Find the green wall. Don't look too much.</div>
  <button class="btn" id="start-btn">ENTER THE DARK</button>
  <div class="hint">
    ↑↓ MOVE &nbsp;·&nbsp; ↺↻ or ← → TURN<br>
    SPACE / FLASH BUTTON to illuminate<br>
    FIRST FLASH shows a map · LISTEN for heartbeat
  </div>
</div>

<div id="msgscreen">
  <div class="msg-title"></div>
  <div class="msg-sub"></div>
  <div class="msg-info"></div>
  <button class="btn" style="margin-top:38px" id="retry-btn">TRY AGAIN</button>
</div>

<svg id="crosshair" width="18" height="18" viewBox="0 0 18 18">
  <line x1="9" y1="1" x2="9" y2="7" stroke="white" stroke-width="1"/>
  <line x1="9" y1="11" x2="9" y2="17" stroke="white" stroke-width="1"/>
  <line x1="1" y1="9" x2="7" y2="9" stroke="white" stroke-width="1"/>
  <line x1="11" y1="9" x2="17" y2="9" stroke="white" stroke-width="1"/>
</svg>

<div id="dpad">
  <div class="db" id="b-fwd">↑</div>
  <div class="db" id="b-back">↓</div>
</div>
<div id="turn-btns">
  <div class="tb" id="b-turnL">↺</div>
  <div class="tb" id="b-turnR">↻</div>
</div>
<button id="flash-btn"><span class="fi">⚡</span>FLASH</button>

<script>
// ══════════════════════════════════════════════════════════════
//  THE FLASH-STEP  v3
// ══════════════════════════════════════════════════════════════
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W, H;

// ── Audio ─────────────────────────────────────────────────────
let audioCtx = null;
function getAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}
function tone(freq,type,dur,vol=0.15,delay=0){
  try{
    const a=getAudio(),o=a.createOscillator(),g=a.createGain();
    o.connect(g);g.connect(a.destination);
    o.type=type;o.frequency.value=freq;
    const t=a.currentTime+delay;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.start(t);o.stop(t+dur+0.05);
  }catch(e){}
}
function playShutter(){
  tone(900,'square',0.025,0.07);
  tone(350,'square',0.05,0.04,0.02);
}
function playFootstep(){
  try{
    const a=getAudio();
    const buf=a.createBuffer(1,a.sampleRate*0.055,a.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.max(0,1-i/(d.length*0.25));
    const src=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter();
    f.type='lowpass';f.frequency.value=280;
    src.buffer=buf;src.connect(f);f.connect(g);g.connect(a.destination);
    g.gain.value=0.22;src.start();
  }catch(e){}
}
function playHeartbeat(intensity){
  try{
    const a=getAudio(),t=a.currentTime;
    const thump=(when,vol)=>{
      const o=a.createOscillator(),g=a.createGain();
      o.connect(g);g.connect(a.destination);
      o.type='sine';o.frequency.setValueAtTime(58,when);
      o.frequency.exponentialRampToValueAtTime(28,when+0.12);
      g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(vol,when+0.01);
      g.gain.exponentialRampToValueAtTime(0.001,when+0.2);
      o.start(when);o.stop(when+0.22);
    };
    thump(t,0.28*intensity);
    thump(t+0.14,0.14*intensity);
  }catch(e){}
}
function playCatch(){
  for(let i=0;i<7;i++) tone(75-i*6,'sawtooth',0.35,0.35,i*0.065);
  tone(200,'square',0.9,0.18,0.08);
}
function playWin(){
  [523,659,784,1047].forEach((f,i)=>tone(f,'sine',0.4,0.14,i*0.11));
}

// ── State ─────────────────────────────────────────────────────
let gameState='menu', level=1, flashCount=0;
let flashHeld=false, flashAlpha=0, flashDecay=0, outlineAlpha=0, flashHeldMs=0;
let lastTime=0, frameId;
let bobTimer=0, isMoving=false, footstepTimer=0, heartbeatTimer=0;
let shakeX=0,shakeY=0,shakeAmt=0;
let firstFlashDone=false, minimapTimer=0;
let eyePulse=0;

// ── Player ────────────────────────────────────────────────────
const P={x:1.5,y:1.5,angle:0};
const MOVE_SPD=3.2, TURN_SPD=2.5;

// ── Enemy ─────────────────────────────────────────────────────
const E={x:0,y:0,moveTimer:0};
let ENEMY_MS=900;

// ── Input ─────────────────────────────────────────────────────
const keys={};
const dpad={fwd:false,back:false,turnL:false,turnR:false};
let lookStart=null, lookDelta=0;

// ── Map ───────────────────────────────────────────────────────
let MAP,COLS,ROWS;
const FOV=Math.PI/2.3, HFOV=FOV/2, MAXD=18, NR=240;

function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}

// ── Maze ──────────────────────────────────────────────────────
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*i|0;[a[i],a[j]]=[a[j],a[i]]}return a}

function genMaze(cols,rows){
  if(cols%2===0)cols++;if(rows%2===0)rows++;
  const g=Array.from({length:rows},(_,r)=>Array.from({length:cols},(_,c)=>(r%2===0||c%2===0)?1:0));
  const vis=new Set(['1,1']);
  const stk=[[1,1]];
  while(stk.length){
    const[r,c]=stk[stk.length-1];
    const dirs=shuf([[0,2],[0,-2],[2,0],[-2,0]]);
    let mv=false;
    for(const[dr,dc]of dirs){
      const nr=r+dr,nc=c+dc;
      if(nr>0&&nr<rows-1&&nc>0&&nc<cols-1&&!vis.has(`${nr},${nc}`)){
        vis.add(`${nr},${nc}`);g[r+dr/2][c+dc/2]=0;stk.push([nr,nc]);mv=true;break;
      }
    }
    if(!mv)stk.pop();
  }
  // Extra loops
  const cands=[];
  for(let r=1;r<rows-1;r++)for(let c=1;c<cols-1;c++){
    if(!g[r][c])continue;
    if(c>0&&c<cols-1&&!g[r][c-1]&&!g[r][c+1])cands.push([r,c]);
    else if(r>0&&r<rows-1&&!g[r-1][c]&&!g[r+1][c])cands.push([r,c]);
  }
  shuf(cands);
  for(let i=0;i<Math.floor(cands.length*0.28);i++)g[cands[i][0]][cands[i][1]]=0;
  return{g,cols,rows};
}

function bfs(pass,cols,rows,fc,fr){
  const d=Array.from({length:rows},()=>new Int32Array(cols).fill(-1));
  d[fr][fc]=0;const q=[[fc,fr]];
  while(q.length){
    const[c,r]=q.shift();
    for(const[dc,dr]of[[0,1],[0,-1],[1,0],[-1,0]]){
      const nc=c+dc,nr=r+dr;
      if(nc<0||nr<0||nc>=cols||nr>=rows||!pass(nc,nr)||d[nr][nc]!==-1)continue;
      d[nr][nc]=d[r][c]+1;q.push([nc,nr]);
    }
  }
  return d;
}

function initGame(){
  resize();
  const sz=Math.min(9+level*2,23);const s=sz%2===0?sz+1:sz;
  const{g,cols,rows}=genMaze(s,s);
  MAP=g;COLS=cols;ROWS=rows;

  P.x=1.5;P.y=1.5;P.angle=Math.PI*0.15;

  // Goal bottom-right
  const gc=cols-2,gr=rows-2;
  MAP[gr][gc]=2;

  // ── Spawn enemy: maximise min(distFromPlayer, distFromGoal) ──
  // This keeps it away from the corridor between start and exit
  const pass=(c,r)=>MAP[r][c]!==1;
  const dp=bfs(pass,cols,rows,1,1);
  const dg=bfs(pass,cols,rows,gc,gr);

  let best=-1,cands=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    if(MAP[r][c]===1||(c===1&&r===1)||(c===gc&&r===gr))continue;
    const score=Math.min(dp[r][c]<0?0:dp[r][c], dg[r][c]<0?0:dg[r][c]);
    if(score>best){best=score;cands=[];}
    if(score===best)cands.push([c,r]);
  }
  shuf(cands);
  const[ec,er]=cands[Math.random()*Math.min(cands.length,Math.max(1,cands.length*0.2))|0];
  E.x=ec+0.5;E.y=er+0.5;E.moveTimer=0;

  ENEMY_MS=Math.max(1100-level*80,420);

  flashCount=0;flashHeld=false;flashAlpha=0;flashDecay=0;outlineAlpha=0;flashHeldMs=0;
  bobTimer=0;isMoving=false;footstepTimer=0;heartbeatTimer=0;
  shakeX=0;shakeY=0;shakeAmt=0;
  firstFlashDone=false;minimapTimer=0;
  updateUI();
}

// ── Raycaster (DDA) ───────────────────────────────────────────
function cast(ox,oy,angle){
  const dx=Math.cos(angle),dy=Math.sin(angle);
  const sx=Math.abs(1/dx)||1e10,sy=Math.abs(1/dy)||1e10;
  let mx=ox|0,my=oy|0;
  let sdx=dx<0?(ox-mx)*sx:(mx+1-ox)*sx;
  let sdy=dy<0?(oy-my)*sy:(my+1-oy)*sy;
  const ddx=dx<0?-1:1,ddy=dy<0?-1:1;
  let side=0,dist=0;
  for(let i=0;i<100;i++){
    if(sdx<sdy){dist=sdx;sdx+=sx;mx+=ddx;side=0;}
    else{dist=sdy;sdy+=sy;my+=ddy;side=1;}
    if(mx<0||my<0||mx>=COLS||my>=ROWS)return{dist:MAXD,goal:false,side:0,wx:0};
    const cell=MAP[my][mx];
    if(cell===1||cell===2){
      const wx=side===0?(oy+dist*dy)%1:(ox+dist*dx)%1;
      return{dist,goal:cell===2,side,wx:Math.abs(wx)};
    }
  }
  return{dist:MAXD,goal:false,side:0,wx:0};
}

// ── Enemy screen pos ──────────────────────────────────────────
function enemyScreen(){
  const dx=E.x-P.x,dy=E.y-P.y;
  const dist=Math.sqrt(dx*dx+dy*dy);
  if(dist<0.1)return null;
  let a=Math.atan2(dy,dx)-P.angle;
  while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;
  if(Math.abs(a)>HFOV*1.35)return null;
  return{sx:W/2+(a/HFOV)*(W/2),dist,ph:Math.min(H*1.65/dist,H*3.5)};
}

// ── Draw ──────────────────────────────────────────────────────
function draw(lit,bob,outline=0){
  ctx.save();
  if(shakeAmt>0){ctx.translate(shakeX*shakeAmt,shakeY*shakeAmt);shakeAmt=Math.max(0,shakeAmt-0.045);}
  ctx.fillStyle='#000';ctx.fillRect(-20,-20,W+40,H+40);

  const hs=bob*H*0.28;

  if(lit>0){
    const cg=ctx.createLinearGradient(0,0,0,H/2+hs);
    cg.addColorStop(0,`rgba(5,3,3,${lit})`);cg.addColorStop(1,`rgba(18,10,10,${lit})`);
    ctx.fillStyle=cg;ctx.fillRect(0,0,W,H/2+hs);
    const fg=ctx.createLinearGradient(0,H/2+hs,0,H);
    fg.addColorStop(0,`rgba(14,8,8,${lit})`);fg.addColorStop(1,`rgba(3,1,1,${lit})`);
    ctx.fillStyle=fg;ctx.fillRect(0,H/2+hs,W,H);
  }

  const cw=W/NR, zb=new Float32Array(NR);

  // ── Full colour render (while lit) ──────────────────────────
  if(lit>0){
    for(let i=0;i<NR;i++){
      const ra=P.angle-HFOV+(i/NR)*FOV;
      const{dist,goal,side,wx}=cast(P.x,P.y,ra);
      zb[i]=dist;
      const corr=dist*Math.cos(ra-P.angle);
      const wh=Math.min(H/corr*0.9,H*2.5);
      const top=(H-wh)/2+hs;
      const br=Math.pow(Math.max(0,1-corr/MAXD),1.08)*lit;
      let r,g,b;
      if(goal){
        const gp=0.7+0.3*Math.sin(Date.now()*0.003);
        r=(4+br*18)|0;g=(25+br*170*gp)|0;b=(4+br*22)|0;
      } else {
        const sv=side===1?0.72:1.0;
        const mortar=(wx>0.47&&wx<0.53)?0.6:1.0;
        const shade=br*sv*mortar;
        r=(18+shade*115)|0;g=(10+shade*58)|0;b=(10+shade*62)|0;
      }
      ctx.fillStyle=`rgb(${r},${g},${b})`;
      ctx.fillRect(i*cw,top,cw+1,wh);
    }
  }

  // ── Outline / afterglow pass (lingers after flash released) ──
  // Draws only the wall top & bottom edges — dim wireframe you can navigate by
  if(outline>0 && lit<0.9){
    const oLit=outline*(1-lit); // fade out as full light comes back on
    for(let i=0;i<NR;i++){
      const ra=P.angle-HFOV+(i/NR)*FOV;
      const{dist,goal}=cast(P.x,P.y,ra);
      const corr=dist*Math.cos(ra-P.angle);
      const wh=Math.min(H/corr*0.9,H*2.5);
      const top=(H-wh)/2+hs;
      const bright=Math.pow(Math.max(0,1-corr/MAXD),1.2)*oLit;
      if(bright<0.004) continue;
      // Goal outline stays green-tinted
      const edgeCol=goal
        ?`rgba(0,${(bright*180)|0},${(bright*40)|0},${bright})`
        :`rgba(${(bright*130)|0},${(bright*80)|0},${(bright*80)|0},${bright})`;
      ctx.fillStyle=edgeCol;
      // Top edge line
      ctx.fillRect(i*cw, top, cw+1, Math.max(1, wh*0.025));
      // Bottom edge line
      ctx.fillRect(i*cw, top+wh-Math.max(1,wh*0.025), cw+1, Math.max(1,wh*0.025));
    }
    // Faint floor/ceiling divide line so you know which way is up
    const lineAlpha=oLit*0.12;
    ctx.fillStyle=`rgba(80,50,50,${lineAlpha})`;
    ctx.fillRect(0,H/2+hs-1,W,2);
  }

  // ── Enemy ─────────────────────────────────────────────────
  eyePulse=0.55+0.45*Math.sin(Date.now()*0.004);
  const es=enemyScreen();
  const ed=es?es.dist:999;

  // Ambient eyes in dark — visible from ~5 units away
  if(es&&es.dist<5.5){
    const ea=Math.pow(1-es.dist/5.5,2.2)*0.95*eyePulse;
    if(ea>0.015){
      const ey=H/2-es.ph*0.38+hs;
      const esz=Math.max(1.5,es.ph*0.036);
      const eo=Math.max(2.5,es.ph*0.088);
      [es.sx-eo,es.sx+eo].forEach(ex=>{
        const eg=ctx.createRadialGradient(ex,ey,0,ex,ey,esz*4.5);
        eg.addColorStop(0,`rgba(255,25,25,${ea})`);
        eg.addColorStop(0.5,`rgba(180,0,0,${ea*0.4})`);
        eg.addColorStop(1,'transparent');
        ctx.fillStyle=eg;ctx.fillRect(ex-esz*6,ey-esz*6,esz*12,esz*12);
        ctx.fillStyle=`rgba(255,230,190,${Math.min(1,ea*1.3)})`;
        ctx.beginPath();ctx.arc(ex,ey,esz*0.75,0,Math.PI*2);ctx.fill();
      });
    }
  }

  // Full render when lit
  if(es&&lit>0){
    const{sx,dist:d,ph}=es;
    const sw=ph*0.58,sprX=sx-sw/2,sprY=H/2-ph*0.5+hs;
    const sc0=Math.max(0,(sprX/W*NR)|0),sc1=Math.min(NR-1,((sprX+sw)/W*NR)|0);
    ctx.save();
    ctx.beginPath();
    for(let sc=sc0;sc<=sc1;sc++) if(zb[sc]>d){const px=sc*cw;ctx.rect(px,0,cw+1,H);}
    ctx.clip();

    // Aura
    const ga=Math.max(0,(1-d/9))*lit*0.5*eyePulse;
    if(ga>0){
      const grd=ctx.createRadialGradient(sx,H/2+hs,0,sx,H/2+hs,sw*1.6);
      grd.addColorStop(0,`rgba(150,0,0,${ga})`);grd.addColorStop(1,'transparent');
      ctx.fillStyle=grd;ctx.fillRect(sprX-sw,sprY-ph*0.5,sw*3,ph*2);
    }

    const ba=Math.min(1,lit*1.1)*Math.min(1,5/d);
    // Body
    ctx.fillStyle=`rgba(5,1,1,${ba})`;
    ctx.fillRect(sprX+sw*0.23,sprY+ph*0.2,sw*0.54,ph*0.76);
    // Head
    ctx.fillStyle=`rgba(8,2,2,${ba})`;
    ctx.beginPath();ctx.ellipse(sx,sprY+ph*0.13,sw*0.26,ph*0.16,0,0,Math.PI*2);ctx.fill();
    // Eyes (lit)
    const ela=Math.min(1,lit*1.3)*eyePulse;
    const esz=Math.max(1.5,ph*0.036),eo=Math.max(2,ph*0.088),ey2=sprY+ph*0.1;
    [sx-eo,sx+eo].forEach(ex=>{
      const eg=ctx.createRadialGradient(ex,ey2,0,ex,ey2,esz*3.5);
      eg.addColorStop(0,`rgba(255,45,45,${ela})`);eg.addColorStop(1,'transparent');
      ctx.fillStyle=eg;ctx.fillRect(ex-esz*4,ey2-esz*4,esz*8,esz*8);
      ctx.fillStyle=`rgba(255,235,195,${ela})`;
      ctx.beginPath();ctx.arc(ex,ey2,esz,0,Math.PI*2);ctx.fill();
    });
    // Arms
    if(ph>45){
      ctx.strokeStyle=`rgba(4,1,1,${ba*0.8})`;ctx.lineWidth=Math.max(1,sw*0.06);
      ctx.beginPath();ctx.moveTo(sx-sw*0.17,sprY+ph*0.44);ctx.lineTo(sx-sw*0.6,sprY+ph*0.7);ctx.stroke();
      ctx.beginPath();ctx.moveTo(sx+sw*0.17,sprY+ph*0.44);ctx.lineTo(sx+sw*0.6,sprY+ph*0.7);ctx.stroke();
    }
    ctx.restore();
  }

  // Vignette
  if(lit>0){
    const vg=ctx.createRadialGradient(W/2,H/2,H*0.18,W/2,H/2,H*0.88);
    vg.addColorStop(0,'transparent');vg.addColorStop(1,`rgba(0,0,0,${0.62*lit})`);
    ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
    // Flash burst
    if(flashDecay>0.87){const b=(flashDecay-0.87)/0.13;ctx.fillStyle=`rgba(255,252,238,${b*0.13})`;ctx.fillRect(0,0,W,H);}
    // Scanlines
    ctx.fillStyle='rgba(0,0,0,0.05)';
    for(let y=0;y<H;y+=3)ctx.fillRect(0,y,W,1);
  }

  // Proximity danger ring — red vignette pulses when enemy is close (even in dark)
  const pd=Math.sqrt((P.x-E.x)**2+(P.y-E.y)**2);
  if(pd<5){
    const pi=(1-pd/5)*0.5*eyePulse;
    const pv=ctx.createRadialGradient(W/2,H/2,H*0.08,W/2,H/2,H*0.75);
    pv.addColorStop(0,'transparent');pv.addColorStop(1,`rgba(110,0,0,${pi})`);
    ctx.fillStyle=pv;ctx.fillRect(0,0,W,H);
  }

  // ── Minimap (3 sec on first flash, corner) ─────────────────
  if(minimapTimer>0&&gameState==='playing'){
    const a=Math.min(1,minimapTimer*0.8)*0.88;
    const ms=Math.max(4,Math.min(7,Math.floor(Math.min(W,H)/(COLS*1.6))));
    const mw=COLS*ms,mh=ROWS*ms,mx2=W-mw-14,my2=14;
    ctx.save();ctx.globalAlpha=a;
    ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(mx2-4,my2-4,mw+8,mh+8);
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      const cv=MAP[r][c];
      ctx.fillStyle=cv===1?'#150808':cv===2?'#005518':'#0e0808';
      ctx.fillRect(mx2+c*ms,my2+r*ms,ms,ms);
    }
    // Player
    ctx.fillStyle='#ffffff';ctx.fillRect(mx2+P.x*ms-1.5,my2+P.y*ms-1.5,3,3);
    // Enemy
    ctx.fillStyle='#ff2020';ctx.fillRect(mx2+E.x*ms-1.5,my2+E.y*ms-1.5,3,3);
    // Direction tick
    ctx.strokeStyle='#aaa';ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(mx2+P.x*ms,my2+P.y*ms);
    ctx.lineTo(mx2+(P.x+Math.cos(P.angle)*2.5)*ms,my2+(P.y+Math.sin(P.angle)*2.5)*ms);
    ctx.stroke();
    ctx.globalAlpha=1;ctx.restore();
  }

  ctx.restore();
}

// ── Enemy step ────────────────────────────────────────────────
function stepEnemy(){
  const gc=E.x|0,gr=E.y|0,pc=P.x|0,pr=P.y|0;
  if(gc===pc&&gr===pr)return;
  const pass=(c,r)=>MAP[r][c]!==1;
  const dm=bfs(pass,COLS,ROWS,pc,pr);
  const cur=dm[gr][gc];if(cur<=0)return;
  const dirs=shuf([[0,1],[0,-1],[1,0],[-1,0]]);
  for(const[dc,dr]of dirs){
    const nc=gc+dc,nr=gr+dr;
    if(nc<0||nr<0||nc>=COLS||nr>=ROWS||!pass(nc,nr))continue;
    const d=dm[nr][nc];
    if(d>=0&&d<cur){E.x=nc+0.5;E.y=nr+0.5;return;}
  }
}

function checkEnd(){
  if(Math.sqrt((P.x-E.x)**2+(P.y-E.y)**2)<0.52)return'dead';
  const pc=P.x|0,pr=P.y|0;
  if(MAP[pr]&&MAP[pr][pc]===2)return'win';
  return null;
}

function isWall(x,y,m=0.3){
  for(const[cx,cy]of[[x-m,y-m],[x+m,y-m],[x-m,y+m],[x+m,y+m]]){
    const c=cx|0,r=cy|0;
    if(c<0||r<0||c>=COLS||r>=ROWS||MAP[r][c]===1)return true;
  }
  return false;
}

// ── Loop ──────────────────────────────────────────────────────
function loop(ts){
  const dt=Math.min(ts-lastTime,50);lastTime=ts;
  if(gameState!=='playing'){frameId=requestAnimationFrame(loop);return;}

  // Flash — two stage fade
  if(flashHeld){
    flashAlpha=Math.min(1,flashAlpha+dt/28);
    flashDecay=flashAlpha;
    flashHeldMs+=dt;
    outlineAlpha=1; // outline fully charged while holding
  } else {
    flashAlpha=Math.max(0,flashAlpha-dt/120);   // color fades in ~0.12s
    flashDecay=Math.max(0,flashDecay-dt/52);
    // Outline lingers: longer you held, longer it stays (0.5s base + up to 5s extra)
    const lingerMs=500+Math.min(flashHeldMs*3,5000);
    outlineAlpha=Math.max(0,outlineAlpha-dt/lingerMs);
    flashHeldMs=0;
  }

  // Move
  const fwd=(keys['w']||keys['arrowup']||dpad.fwd?1:0)-(keys['s']||keys['arrowdown']||dpad.back?1:0);
  const trn=(keys['d']||keys['arrowright']||dpad.turnR?1:0)-(keys['a']||keys['arrowleft']||dpad.turnL?1:0)+lookDelta*0.011;
  lookDelta*=0.62;
  P.angle+=trn*TURN_SPD*dt/1000;

  isMoving=false;
  if(fwd!==0){
    const spd=MOVE_SPD*dt/1000;
    const nx=P.x+Math.cos(P.angle)*spd*fwd;
    const ny=P.y+Math.sin(P.angle)*spd*fwd;
    if(!isWall(nx,P.y))P.x=nx;
    if(!isWall(P.x,ny))P.y=ny;
    bobTimer+=dt*0.009;isMoving=true;
    footstepTimer-=dt;
    if(footstepTimer<=0){playFootstep();footstepTimer=370;}
  } else {footstepTimer=0;}

  // Enemy (only when flash on)
  if(flashAlpha>0.04){
    if(!firstFlashDone){firstFlashDone=true;minimapTimer=4;}
    E.moveTimer+=dt;
    while(E.moveTimer>=ENEMY_MS){E.moveTimer-=ENEMY_MS;stepEnemy();}
  }
  if(minimapTimer>0)minimapTimer-=dt/1000;

  // Heartbeat — proximity-based
  const pd=Math.sqrt((P.x-E.x)**2+(P.y-E.y)**2);
  const hbRate=pd<2?3.2:pd<3.5?2.2:pd<6?1.4:0;
  if(hbRate>0){
    heartbeatTimer-=dt;
    if(heartbeatTimer<=0){playHeartbeat(hbRate);heartbeatTimer=Math.max(280,950/hbRate);}
  } else heartbeatTimer=0;

  const result=checkEnd();
  if(result){
    gameState=result;flashHeld=false;
    if(result==='dead'){shakeX=(Math.random()-.5)*18;shakeY=(Math.random()-.5)*18;shakeAmt=1;setTimeout(playCatch,60);}
    else playWin();
    setTimeout(()=>showMsg(result),result==='dead'?280:480);
  }

  updateUI();
  const bob=isMoving?Math.sin(bobTimer)*0.036:0;
  draw(flashAlpha>0?flashAlpha:flashDecay*0.32, bob, outlineAlpha);
  frameId=requestAnimationFrame(loop);
}

function updateUI(){
  document.getElementById('s-flash').innerHTML=`FLASHES<br>${flashCount}`;
  document.getElementById('s-level').textContent=`LEVEL ${level}`;
  const dx=P.x-(COLS-1.5),dy=P.y-(ROWS-1.5);
  document.getElementById('s-dist').innerHTML=`DIST<br>${gameState==='playing'?Math.round(Math.sqrt(dx*dx+dy*dy)):'—'}`;
  const sm=document.getElementById('s-moving');if(sm)sm.style.opacity=isMoving?'1':'0';
}
function showMsg(type){
  const el=document.getElementById('msgscreen');
  el.className=type;
  el.querySelector('.msg-title').textContent=type==='dead'?'CAUGHT':'ESCAPED';
  el.querySelector('.msg-sub').textContent=type==='dead'
    ?'IT WAS WAITING FOR YOU'
    :`LEVEL ${level} COMPLETE`;
  el.querySelector('.msg-info').textContent=`FLASHES USED: ${flashCount}  ·  LEVEL ${level}`;
  el.classList.add('show');
  document.getElementById('retry-btn').textContent=type==='win'?'NEXT LEVEL':'TRY AGAIN';
  if(type==='win') level++;
}

// ── Controls ──────────────────────────────────────────────────
function startFlash(){if(gameState!=='playing')return;if(!flashHeld){flashCount++;playShutter();}flashHeld=true;}
function stopFlash(){flashHeld=false;}

document.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();
  if(e.key===' ')startFlash();
});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.key===' ')stopFlash();});

const fb=document.getElementById('flash-btn');
fb.addEventListener('touchstart',e=>{e.preventDefault();startFlash();fb.classList.add('active');},{passive:false});
fb.addEventListener('touchend',  e=>{e.preventDefault();stopFlash();fb.classList.remove('active');},{passive:false});
fb.addEventListener('mousedown', ()=>startFlash());
fb.addEventListener('mouseup',   ()=>stopFlash());

function dBtn(id,key){
  const el=document.getElementById(id);if(!el)return;
  el.addEventListener('touchstart',e=>{e.preventDefault();dpad[key]=true;el.classList.add('pressed');},{passive:false});
  el.addEventListener('touchend',  e=>{e.preventDefault();dpad[key]=false;el.classList.remove('pressed');},{passive:false});
  el.addEventListener('mousedown', ()=>{dpad[key]=true;el.classList.add('pressed');});
  document.addEventListener('mouseup',()=>{dpad[key]=false;el.classList.remove('pressed');});
}
dBtn('b-fwd','fwd');dBtn('b-back','back');dBtn('b-turnL','turnL');dBtn('b-turnR','turnR');

// Swipe-to-look on canvas
canvas.addEventListener('touchstart',e=>{
  for(const t of e.changedTouches)
    if(!lookStart&&t.clientX>W*0.3&&t.clientX<W*0.7)
      lookStart={id:t.identifier,x:t.clientX};
},{passive:true});
canvas.addEventListener('touchmove',e=>{
  for(const t of e.changedTouches)
    if(lookStart&&t.identifier===lookStart.id){lookDelta+=(t.clientX-lookStart.x)*0.55;lookStart.x=t.clientX;}
},{passive:true});
canvas.addEventListener('touchend',e=>{
  for(const t of e.changedTouches)
    if(lookStart&&t.identifier===lookStart.id)lookStart=null;
},{passive:true});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
window.addEventListener('resize',resize);

document.getElementById('start-btn').addEventListener('click',()=>{
  level=1;getAudio();
  document.getElementById('overlay').classList.add('hidden');
  initGame();gameState='playing';lastTime=performance.now();
  frameId=requestAnimationFrame(loop);
});
document.getElementById('retry-btn').addEventListener('click',()=>{
  document.getElementById('msgscreen').classList.remove('show');
  // level was already incremented on win, kept same on death — correct either way
  initGame();gameState='playing';lastTime=performance.now();
});

resize();ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
</script>
